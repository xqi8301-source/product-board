<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>齐夏 · 产品看板</title>
<style>
  :root{
    --bg:#f5f2ec; --card:#fffdf9; --ink:#2a251f; --sub:#7c7369; --line:#e5ded2;
    --red:#bd3a2b; --redbg:#fbe9e6; --amber:#a9721a; --amberbg:#fdf3e1;
    --green:#2e6b4b; --greenbg:#e9f2ec; --blue:#2f5c88; --bluebg:#e9eff7; --accent:#8a5a2b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 70px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;
    border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
  h1{font-size:21px;margin:0}
  h1 small{display:block;font-size:12px;color:var(--sub);font-weight:400;margin-top:5px}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:6px 12px;border-radius:999px;cursor:pointer}
  button:hover{border-color:#c9bda9}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.save{background:var(--accent);color:#fff;border-color:var(--accent);border-radius:7px;
    padding:5px 10px;font-size:11.5px}
  button.save:disabled{opacity:.45;cursor:not-allowed}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .kpi .n{font-size:24px;font-weight:700;line-height:1.1}
  .kpi .l{font-size:11.5px;color:var(--sub);margin-top:3px}
  .kpi.warn .n{color:var(--red)} .kpi.mid .n{color:var(--amber)}
  .list{display:block}
  .p{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 11px 10px;
    min-height:302px;display:flex;flex-direction:column}
  .p.bad{border-left:4px solid var(--red)}
  .p.red2{border-left:4px solid var(--amber)}
  .p.ok{border-left:4px solid var(--green)}
  .p .top{display:block}
  .p .nm{font-size:12.5px;font-weight:650;line-height:1.3;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .p .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .tag{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);
    background:#fff;color:var(--sub);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tag.r{color:var(--red);border-color:#eab7b0;background:#fff6f4}
  .tag.a{color:var(--amber);border-color:#e9cfa2;background:#fffaf0}
  .tag.g{color:var(--green);border-color:#c2d8ca;background:#f5fbf7}
  .tag.b{color:var(--blue);border-color:#c6d5e6;background:#f4f8fd}
  .chain{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin:6px 0 0;font-size:10.5px;
    color:var(--sub)}
  .node{padding:1px 5px;border-radius:5px;border:1px solid var(--line);background:#fdfbf7;
    white-space:nowrap;flex:0 0 auto}
  .node.over{border-color:#eab7b0;background:var(--redbg);color:var(--red);font-weight:600}
  .node.done{border-color:#c2d8ca;background:var(--greenbg);color:var(--green)}
  .arrow{color:#c8bfb1}
  .note{font-size:10px;color:var(--sub);background:#faf7f2;border:1px dashed var(--line);
    border-radius:6px;padding:4px 6px;margin-top:6px;line-height:1.35}
  .dec{margin-top:6px;flex:1;display:flex;flex-direction:column;min-height:0}
  .p .top,.p .tags,.p .chain,.p .note{flex:0 0 auto}
  .dec label{display:block;font-size:10px;color:var(--sub);margin-bottom:3px}
  textarea{width:100%;flex:1;min-height:0;resize:none;font:inherit;font-size:10.5px;line-height:1.4;
    border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink)}
  textarea:focus{outline:2px solid #e3d3bd;border-color:#d9c8ae}
  .decbar{display:flex;align-items:center;gap:8px;margin-top:6px}
  .msg{font-size:11.5px;color:var(--sub)}
  .msg.ok{color:var(--green)} .msg.err{color:var(--red)}
  #gate{position:fixed;inset:0;background:#f5f2ec;display:flex;align-items:center;justify-content:center;z-index:99}
  .gatebox{background:#fffdf9;border:1px solid #e5ded2;border-radius:14px;padding:26px 24px;width:min(340px,86vw);text-align:center}
  .gatebox h2{margin:0 0 6px;font-size:17px}
  .gatebox p{margin:0 0 14px;font-size:12px;color:#7c7369}
  .gatebox input{width:100%;padding:9px 10px;border:1px solid #e5ded2;border-radius:8px;font-size:14px;text-align:center}
  .gatebox button{margin-top:12px;width:100%;padding:9px;border:none;border-radius:8px;background:#8a5a2b;color:#fff;font-size:14px;cursor:pointer}
  #gateMsg{margin-top:10px;font-size:12px;color:#bd3a2b;min-height:16px}
  table.tb{width:100%;border-collapse:collapse;font-size:11.5px;background:#fffdf9;border:1px solid #e5ded2;border-radius:10px;overflow:hidden}
  table.tb th{background:#faf6f0;color:#7c7369;text-align:left;padding:7px 8px;border-bottom:1px solid #e5ded2;white-space:nowrap;font-weight:600;font-size:11px}
  table.tb td{padding:7px 8px;border-bottom:1px dashed #efe9df;vertical-align:top}
  table.tb tr:last-child td{border-bottom:none}
  table.tb td.nm{font-weight:600;min-width:150px}
  table.tb td.dec{max-width:340px;white-space:pre-wrap;color:#7c7369;font-size:11px}
  footer{margin-top:26px;border-top:1px solid var(--line);padding-top:12px;font-size:11.5px;color:var(--sub)}
  .empty{color:var(--sub);font-size:13px;padding:20px;text-align:center}
  .online{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-top:12px;overflow-x:auto}
  .online table{width:100%;min-width:880px;border-collapse:collapse;font-size:11.5px}
  .online th{background:#faf6f0;color:var(--sub);font-weight:600;text-align:left;padding:7px 8px;
    border-bottom:1px solid var(--line);white-space:nowrap;font-size:11px}
  .online td{padding:7px 8px;border-bottom:1px dashed #efe9df;vertical-align:top;white-space:nowrap}
  .online td:nth-child(3){white-space:normal;min-width:150px}
  .online td:nth-child(8){white-space:normal;min-width:120px}
  .online tr:last-child td{border-bottom:none}
  .online .pn{font-weight:600;font-size:12px;line-height:1.35;white-space:nowrap;max-width:230px;
    overflow:hidden;text-overflow:ellipsis}
  .online td:nth-child(1){min-width:200px}
  .online .sm{color:var(--sub);font-size:10.5px}
  .ddl{display:inline-block;padding:1px 6px;border-radius:5px;border:1px solid var(--line);
    background:#fdfbf7;white-space:nowrap;font-size:10.5px;overflow:visible}
  .ddl.over{background:var(--redbg);border-color:#eab7b0;color:var(--red);font-weight:600}
  .ddl.soon{background:var(--amberbg);border-color:#e9cfa2;color:var(--amber);font-weight:600}
  .ddl.done{background:var(--greenbg);border-color:#c2d8ca;color:var(--green)}
  .grp{margin:22px 0 10px;border-top:1px solid var(--line);padding-top:14px}
  .grp:first-child{border-top:none;margin-top:4px;padding-top:0}
  .grp h2{margin:0;font-size:15px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .grp h2 .cnt{font-size:11.5px;font-weight:500;color:var(--sub);border:1px solid var(--line);
    background:#fff;border-radius:999px;padding:2px 9px}
  .grp h2 .cnt.r{color:var(--red);border-color:#eab7b0;background:#fff5f3}
  .grp h2 .cnt.a{color:var(--amber);border-color:#e9cfa2;background:#fffaf0}
  .grp .hint{font-size:11.5px;color:var(--sub);margin:3px 0 0}
  .grprow{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;
    align-items:start;margin:12px 0 4px}
  .grprow .grp{margin:0;border-top:none;padding-top:0}
  .grp .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:10px;margin-top:11px}
  @media (max-width:520px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .grp .cards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  }
</style>
</head>
<body>
<div id="gate">
  <div class="gatebox">
    <h2>齐夏 · 产品看板</h2>
    <p>输入访问口令</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="口令">
    <button id="unlock">进入</button>
    <div id="gateMsg"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <h1>齐夏 · 产品进度看板
      <small id="sub">加载中…</small>
    </h1>
    <div class="tools">
      <button id="f-all" class="on" data-f="all">全部</button>
      <button id="f-over" data-f="over">只看逾期</button>
      <button id="f-red" data-f="red">只看管道红灯</button>
      <button id="refresh">刷新数据</button>
      <button id="tableBtn">表格模式</button>
      <button id="exportBtn" style="display:none">导出改动</button>
    </div>
  </header>

  <div id="offlineBar" style="display:none;margin:-6px 0 14px;padding:8px 12px;border-radius:8px;
    background:#fdf3e1;border:1px solid #e9cfa2;color:#a9721a;font-size:12px">
    单页离线版：数据为 <b id="snapTime"></b> 的快照。过程决策的修改会存在本机浏览器里，点「导出改动」可以拿到 JSON 交回同步飞书。
  </div>

  <div class="kpis">
    <div class="kpi"><div class="n" id="k-live">-</div><div class="l">在途产品</div></div>
    <div class="kpi warn"><div class="n" id="k-over">-</div><div class="l">节点逾期</div></div>
    <div class="kpi mid"><div class="n" id="k-red">-</div><div class="l">管道判定红灯</div></div>
    <div class="kpi"><div class="n" id="k-nosc">-</div><div class="l">无 SC 承接</div></div>
  </div>

  <div class="list" id="list"></div>

  <footer>
    过程决策直接写入飞书「东来星-落地产品复核」表的「过程决策（需时间戳）」字段，保存后即时生效。<br>
    节点日期与管道判定为只读，来自「产品主表-全生命周期」；判定口径：寻源 7 天 / 确样 21·28·42 天 / 下大货 30 天 / 未出货 35 天 / 未到仓 50 天 / 满意度 20 天。
  </footer>
</div>

  if (p.star) tags.push(`<span class="tag">${p.star}</span>`);
  const canSave = !!p.reviewRid;
  return `<div class="p ${sev(p)}" data-name="${p.name}">
    <div class="top"><div class="nm">${p.name}</div><div class="tags">${tags.join('')}</div></div>
    <div class="chain">${fmtNodes(p.nodes)}</div>
    ${p.note ? `<div class="note">待办备注：${p.note}</div>` : ''}
    <div class="dec">
      <label>过程决策${canSave ? '' : '（复核表无此记录，只读）'}</label>
      <textarea data-rid="${p.reviewRid}" ${canSave ? '' : 'readonly placeholder="复核表未匹配到该产品，无法写回"'}>${(p.decision || '').replace(/</g,'&lt;')}</textarea>
      <div class="decbar">
        <button class="save" ${canSave ? '' : 'disabled'} data-rid="${p.reviewRid}">保存到飞书</button>
        <span class="msg" data-msg="${p.reviewRid}">${canSave ? '' : '该品在复核表里没有对应行'}</span>
      </div>
    </div>
  </div>`;
}

function render() {
  applyLocalEdits();
  const list = document.getElementById('list');
  let ps = DATA.products;
  if (FILTER === 'over') ps = ps.filter(p => p.maxOverdue > 0);
  if (FILTER === 'red')  ps = ps.filter(p => p.judge.startsWith('⚠️'));
  if (!ps.length) { list.innerHTML = '<div class="empty">没有符合条件的品</div>'; return; }

  const known = new Set(GROUPS.map(g => g.key));
  const extra = [...new Set(ps.map(p => p.status))].filter(k => !known.has(k));
  const groups = GROUPS.concat(extra.map(k => ({key:k, title:k, hint:''})));

  // 分组；只有 1 个品的「小组」合并到同一行，避免各自独占一整行
  const blocks = [];
  groups.forEach(g => {
    const items = ps.filter(p => p.status === g.key)
                      .sort((a,b) => (b.maxOverdue - a.maxOverdue) || (b.judge.startsWith('⚠️') - a.judge.startsWith('⚠️')));
    if (!items.length) return;
    const nOver = items.filter(p => p.maxOverdue > 0).length;
    const nRed  = items.filter(p => p.judge.startsWith('⚠️')).length;
    const badges = [`<span class="cnt">${items.length} 个</span>`];
    if (nOver) badges.push(`<span class="cnt r">节点逾期 ${nOver}</span>`);
    if (nRed)  badges.push(`<span class="cnt a">管道红灯 ${nRed}</span>`);
    const sec = `<section class="grp">
      <h2>${g.title}${badges.join('')}</h2>
      ${g.hint ? `<div class="hint">${g.hint}</div>` : ''}
      <div class="cards">${items.map(cardHtml).join('')}</div>
    </section>`;
    blocks.push({ sec, small: items.length <= 1 });
  });

  let html = '';
  let buf = [];
  const flush = () => {
    if (!buf.length) return;
    html += `<div class="grprow">${buf.join('')}</div>`;
    buf = [];
  };
  blocks.forEach(b => {
    if (b.small) buf.push(b.sec);
    else { flush(); html += b.sec; }
  });
  flush();
  list.innerHTML = html + renderOnline(DATA.today);

  list.querySelectorAll('button.save').forEach(btn => {
    btn.addEventListener('click', async () => {
      const rid = btn.dataset.rid;
      const ta = list.querySelector(`textarea[data-rid="${rid}"]`);
      const msg = list.querySelector(`span[data-msg="${rid}"]`);
      btn.disabled = true; msg.className = 'msg'; msg.textContent = '写入中…';
      try {
        if (OFFLINE) {
          const local = JSON.parse(localStorage.getItem('qx_decisions') || '{}');
          local[rid] = ta.value;
          localStorage.setItem('qx_decisions', JSON.stringify(local));
          msg.className = 'msg ok';
          msg.textContent = '✓ 已保存到本机（未同步飞书）';
          return;
        }
        const r = await fetch('/api/save', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({rid, text: ta.value})
        });
        const j = await r.json();
        if (j.ok) { msg.className = 'msg ok'; msg.textContent = '✓ 已写入飞书 ' + j.time; }
        else { msg.className = 'msg err'; msg.textContent = '✗ ' + (j.error || '写入失败'); }
      } catch (e) {
        msg.className = 'msg err'; msg.textContent = '✗ ' + e.message;
      } finally { btn.disabled = false; }
    });
  });
}

const ONLINE_STAGES = ['落地中-大货中','落地中-发货中','滚动备货','落地中-满意度验证中'];
function ddlTag(dateStr, done, today) {
  if (!dateStr) return '<span class="sm">—</span>';
  if (done) return `<span class="ddl done">${dateStr.slice(5)} ✓</span>`;
  const d = (new Date(dateStr) - new Date(today)) / 86400000;
  if (d < 0) return `<span class="ddl over">${dateStr.slice(5)} 逾期${Math.abs(Math.round(d))}天</span>`;
  if (d <= 7) return `<span class="ddl soon">${dateStr.slice(5)} 剩${Math.round(d)}天</span>`;
  return `<span class="ddl">${dateStr.slice(5)}</span>`;
}
function renderOnline(today) {
  const items = DATA.products.filter(p => ONLINE_STAGES.includes(p.status)
    && (p.online.hasTask || p.online.cang));
  if (!items.length) return '';
  const alerts = items.reduce((n,p) => n + (p.online.alerts||[]).length, 0);
  const rows = items.map(p => {
    const o = p.online, done = (o.detailProgress||'').includes('已完成');
    const al = (o.alerts||[]).map(a => `<span class="ddl over">${a.k} ${a.d}天</span>`).join(' ');
    return `<tr>
      <td><div class="pn">${p.name}</div><div class="sm">${p.status}｜SC ${p.sc}</div></td>
      <td>${o.cang ? `<span class="ddl">${o.cang.slice(5)}</span>${o.daysToCang!==null && o.daysToCang!==undefined ? `<div class="sm">${o.daysToCang>=0?'剩'+o.daysToCang+'天':'已过期'}</div>` : ''}` : '<span class="sm">—</span>'}</td>
      <td>${o.hasTask ? `<div>${o.detailType || '商详'}</div>
            <div class="sm">${o.detailProgress || '未开始'}${o.designer ? '｜' + o.designer : ''}</div>`
          : '<span class="sm">无商详任务</span>'}</td>
      <td>${o.submitted && o.wikiDdl
            ? `<span class="ddl done" title="任务已完成">${o.wikiDdl.slice(5)} 已交</span>`
            : (o.firm ? ddlTag(o.wikiDdl, done, today)
                      : (o.wikiDdl ? `<span class="ddl" title="到仓未确定，仅作参考">${o.wikiDdl.slice(5)} 参考</span>` : '<span class="sm">—</span>'))}</td>
      <td>${o.firm ? ddlTag(o.designDdl, done, today)
                   : (o.designDdl ? `<span class="ddl" title="到仓未确定，仅作参考">${o.designDdl.slice(5)} 参考</span>` : '<span class="sm">—</span>')}</td>
      <td>${o.shootStatus ? `<span class="ddl ${o.shootStatus.includes('已完成')?'done':''}">${o.shootStatus}</span>` : '<span class="sm">—</span>'}</td>
      <td>${o.firm ? ddlTag(o.listDdl, false, today)
                   : (o.listDdl ? `<span class="ddl" title="到仓未确定，仅作参考">${o.listDdl.slice(5)} 参考</span>` : '<span class="sm">—</span>')}</td>
      <td>${al || '<span class="sm">—</span>'}</td>
    </tr>`;
  }).join('');
  return `<section class="grp">
    <h2>上线接力${' '}<span class="cnt">${items.length} 个</span>${alerts?`<span class="cnt r">上线提醒 ${alerts}</span>`:''}</h2>
    <div class="hint">商详提交 → 设计出图 → 拍摄 → 上架；DDL 逾期或 7 天内到期会标红／标黄</div>
    <div class="online"><table>
      <thead><tr><th style="width:22%">产品</th><th>到仓</th><th style="width:16%">商详任务</th>
      <th>商详提交 DDL</th><th>设计 DDL</th><th>拍摄</th><th>上架建议 DDL</th><th>提醒</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </section>`;
}


function applyLocalEdits() {
  try {
    const local = JSON.parse(localStorage.getItem('qx_decisions') || '{}');
    DATA.products.forEach(p => { if (local[p.reviewRid] !== undefined) p.decision = local[p.reviewRid]; });
  } catch (e) {}
}
function renderOfflineNote() {
  const el = document.getElementById('snapTime');
  if (el) el.textContent = DATA.generated;
}
function exportEdits() {
  const local = JSON.parse(localStorage.getItem('qx_decisions') || '{}');
  const payload = {
    exported: new Date().toLocaleString(),
    snapshot: DATA.generated,
    edits: Object.entries(local).map(([rid, text]) => ({
      rid,
      product: (DATA.products.find(p => p.reviewRid === rid) || {}).name || '',
      text
    }))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '齐夏-过程决策改动-' + DATA.today + '.json';
  a.click();
}
document.getElementById('exportBtn').addEventListener('click', exportEdits);

function fillKpi() {
  const k = DATA.kpi;
  document.getElementById('k-live').textContent = k.live;
  document.getElementById('k-over').textContent = k.overdue;
  document.getElementById('k-red').textContent = k.red || 0;
  document.getElementById('k-nosc').textContent = k.nosc;
  document.getElementById('sub').textContent =
    `${DATA.today} ｜ 数据生成 ${DATA.generated} ｜ 数据源：线上零售供应链落地表`;
}

async function load(refresh) {
  document.getElementById('sub').textContent = '加载中…';
  const r = await fetch('/api/data' + (refresh ? '?refresh=1' : ''));
  DATA = await r.json();
  fillKpi(); render();
}

document.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-f]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); FILTER = b.dataset.f; render();
}));
document.getElementById('refresh').addEventListener('click', () => load(true));
// ---------- 解密 + 启动 ----------
const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));

async function decryptPayload(password) {
  const p = window.ENCRYPTED_PAYLOAD;
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(p.salt), iterations: p.iter, hash: 'SHA-256' },
    keyMat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) }, key, b64(p.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function unlock(pw) {
  const msg = document.getElementById('gateMsg');
  msg.textContent = '';
  try {
    DATA = await decryptPayload(pw);
    sessionStorage.setItem('qx_pw', pw);
    start();
  } catch (e) {
    msg.textContent = '口令不对，或数据损坏';
  }
}

function start() {
  OFFLINE = true;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('offlineBar').style.display = 'block';
  document.getElementById('refresh').style.display = 'none';
  document.getElementById('exportBtn').style.display = '';
  fillKpi(); render(); renderOfflineNote();
}

document.getElementById('unlock').addEventListener('click', () => unlock(document.getElementById('pw').value.trim()));
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(document.getElementById('pw').value.trim()); });

const saved = sessionStorage.getItem('qx_pw');
if (saved) { unlock(saved); } else { document.getElementById('pw').focus(); }

// ---------- 表格模式 ----------
let VIEW = 'card';
function renderTable() {
  const list = document.getElementById('list');
  let ps = DATA.products;
  if (FILTER === 'over') ps = ps.filter(p => p.maxOverdue > 0);
  if (FILTER === 'red')  ps = ps.filter(p => p.judge.startsWith('⚠️'));
  const rows = ps.map(p => {
    const nextNode = (p.nodes || []).find(n => n.overdue) || (p.nodes || [])[p.nodes.length - 1] || {};
    const dec = (p.decision || '').replace(/</g, '&lt;').replace(/\n/g, ' ');
    return `<tr>
      <td class="nm">${p.name}</td>
      <td>${p.status}</td>
      <td>${p.sc || '—'}</td>
      <td>${nextNode.k ? nextNode.k + ' ' + nextNode.d.slice(5) : '—'}</td>
      <td>${p.maxOverdue ? '<b style="color:#bd3a2b">逾期 ' + p.maxOverdue + ' 天</b>' : '—'}</td>
      <td>${p.judge || '—'}</td>
      <td class="dec">${dec ? dec.slice(0, 120) + (dec.length > 120 ? '…' : '') : '—'}</td>
    </tr>`;
  }).join('');
  list.innerHTML = `<table class="tb"><thead><tr>
    <th>产品</th><th>状态</th><th>SC</th><th>最近节点</th><th>逾期</th><th>管道判定</th><th>过程决策（节选）</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

const origRender = render;
render = function () { if (VIEW === 'table') { applyLocalEdits(); return renderTable(); } return origRender(); };

document.getElementById('tableBtn').addEventListener('click', e => {
  VIEW = (VIEW === 'table') ? 'card' : 'table';
  e.target.textContent = (VIEW === 'table') ? '卡片模式' : '表格模式';
  render();
});
</script>
